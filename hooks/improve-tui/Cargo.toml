[package]
name = "improve-tui"
version = "0.1.0"
edition = "2021"
description = "Ratatui front-end for the harness improvement queue (queue.sh is the source of truth)"

[[bin]]
name = "improve-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
